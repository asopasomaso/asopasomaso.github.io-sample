<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>筋トレ食事プランナー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <main class="container">
      <header class="hero card">
        <p class="eyebrow">Muscle Nutrition App</p>
        <h1>筋トレ食事プランナー</h1>
        <p class="description">
          時間帯ごとの食事メニューと、食材別の炭水化物・タンパク質・脂質（g）を管理。<br />
          筋トレでよく使われる代表的な食材だけを厳選しています。
        </p>
      </header>

      <section class="card controls">
        <div class="control-row">
          <label for="meal-time">食事時間</label>
          <input id="meal-time" type="time" value="07:30" />
        </div>
        <div class="control-row">
          <label for="meal-name">メニュー名</label>
          <input id="meal-name" type="text" placeholder="例: 朝食ハイプロテイン" maxlength="40" />
        </div>
        <div class="control-row">
          <label for="ingredient-select">食材を追加</label>
          <select id="ingredient-select"></select>
        </div>
        <button id="add-ingredient" class="primary">食材を追加</button>
      </section>

      <section class="grid two-col">
        <article class="card">
          <div class="section-title-wrap">
            <h2>選択中の食材</h2>
            <span id="ingredient-count" class="chip">0 品目</span>
          </div>
          <ul id="meal-items" class="meal-items"></ul>
          <div class="macro-total">
            <h3>合計PFC（g）</h3>
            <div class="macro-grid">
              <div><span>炭水化物</span><strong id="total-carbs">0.0</strong></div>
              <div><span>タンパク質</span><strong id="total-protein">0.0</strong></div>
              <div><span>脂質</span><strong id="total-fat">0.0</strong></div>
            </div>
          </div>
          <button id="save-meal" class="secondary">このメニューを保存</button>
        </article>

        <article class="card">
          <div class="section-title-wrap">
            <h2>保存済みメニュー</h2>
            <span id="saved-count" class="chip">0 件</span>
          </div>
          <div id="saved-meals" class="saved-meals"></div>
        </article>
      </section>

      <section class="card">
        <h2>筋トレ向け代表食材の栄養一覧（100gあたり）</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>食材</th>
                <th>炭水化物</th>
                <th>タンパク質</th>
                <th>脂質</th>
              </tr>
            </thead>
            <tbody id="ingredient-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <template id="meal-item-template">
      <li class="meal-item">
        <div>
          <p class="name"></p>
          <p class="macro-line"></p>
        </div>
        <button class="remove-btn" type="button">削除</button>
      </li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
